/* ============ DECK BUILDER SCREEN ============ */
/* Two views in one screen: the deck list (both factions, starter + customs) and
   the editor (full faction pool with +/− copy counters). Edits autosave on every
   tap; a deck only becomes playable at exactly 40 cards, but you can leave it
   half-built and come back — it's just marked "not playable" until then. */
let deckEd=null; // {side,id} while editing, null on the list view
function newDeckId(){ return "d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function showDeckScreen(){ deckEd=null; renderDeckScreen(); showScreen("deckScreen"); }
function renderDeckScreen(){ if(deckEd) renderDeckEditor(); else renderDeckList(); }
function renderDeckList(){
  $("deckTitle").textContent="Decks";
  const section=(side,label)=>{
    const rows=allDecks(side).map(d=>{
      const ct=deckCount(d.cards), ok=deckValid(side,d.cards);
      return `<div class="deckRow" data-side="${side}" data-id="${d.id}">
        <div class="dInfo"><div class="dName">${escapeHtml(d.name)}${d.starter?' <span class="dTag">STARTER</span>':''}</div>
        <div class="dCount${ok?'':' bad'}">${ct}/${DECK_SIZE} cards${ok?'':' — not playable yet'}</div></div>
        <div class="dGo">›</div></div>`;
    }).join("");
    return `<h3 class="compSectionTitle${side==="zombie"?' zombieSection':''}">${label}</h3>${rows}
      <button class="btn dNewBtn" data-side="${side}">＋ New deck</button>`;
  };
  $("deckBody").innerHTML =
    `<p class="deckRules">Decks are exactly ${DECK_SIZE} cards, max ${MAX_COPIES} copies of any card. <span class="coreLegend"><span class="coreSwatch"></span>Core Set — the ×4 badge shows what you own</span></p>`+
    section("plant","⚔️ Otherworld") + section("zombie","🎖️ Regime");
}
/* always-visible summary of what's actually in the deck right now — separate from
   the full pool grid below it, so you don't have to hunt through 16 cards to see
   your list. Sits at the top on mobile, in a sticky side rail on desktop (CSS). */
function deckContentsHtml(side,deck,ro){
  const entries = Object.entries(deck.cards)
    .filter(([,c])=>c>0)
    .map(([n,c])=>({n,c,card:ALL_CARDS[n]}))
    .filter(e=>e.card)
    .sort((a,b)=> a.card.c-b.card.c || a.n.localeCompare(b.n));
  const total = entries.reduce((s,e)=>s+e.c,0);
  const body = entries.length
    ? `<div class="dcList">${entries.map(e=>{
        const art=artFor(e.n);
        const thumb=art ? `<img src="${art}" alt="">` : `<span class="dcEmoji">${e.card.e}</span>`;
        return `<div class="dcRow${ro?'':' dcClickable'}" data-n="${escapeHtml(e.n)}"${ro?'':' title="Tap to remove one copy"'}>
          <span class="dcCost">${e.card.c}</span>
          <span class="dcThumb">${thumb}</span>
          <span class="dcName">${escapeHtml(e.n)}</span>
          <span class="dcQty">×${e.c}</span>
        </div>`;
      }).join("")}</div>`
    : `<p class="dcEmpty">No cards yet — tap ＋ on a card below to add it.</p>`;
  return `<div class="deckContents"><h4 class="dcTitle">Your Deck <span class="dcCount">${total}/${DECK_SIZE}</span></h4>${body}</div>`;
}
function renderDeckEditor(){
  const {side,id}=deckEd;
  const deck=getDeck(side,id);
  const ro=!!deck.starter;
  const ct=deckCount(deck.cards);
  let minions=0,tricks=0,envs=0;
  Object.entries(deck.cards).forEach(([n,c])=>{
    const cd=ALL_CARDS[n]; if(!cd) return;
    if(cd.t==="m") minions+=c; else if(cd.t==="e") envs+=c; else tricks+=c;
  });
  $("deckTitle").textContent=deck.name;
  const meta=`<div class="deckMeta">
      <span class="pill ${ct===DECK_SIZE?'ok':'bad'}">🃏 ${ct}/${DECK_SIZE}</span>
      <span class="pill">⚔ ${minions} minions</span><span class="pill">✨ ${tricks} tricks</span><span class="pill">🌍 ${envs} environments</span>
    </div>
    <div class="deckActions">${ro
      ? `<button class="btn small" id="dCopyBtn">📋 Copy to new deck</button><span class="dTag">Starter — view only</span>`
      : `<button class="btn small" id="dRenameBtn">✏️ Rename</button><button class="btn small" id="dCopyBtn">📋 Duplicate</button><button class="btn small danger" id="dDelBtn">🗑 Delete</button>`}
    </div>`;
  const grid=poolFor(side).map(c=>{
    const n=deck.cards[c.n]||0;
    const ctl = ro
      ? `<div class="cardCtl"><span class="ctlCount">×${n}</span></div>`
      : `<div class="cardCtl">
          <button class="ctlBtn" data-n="${escapeHtml(c.n)}" data-d="-1"${n===0?' disabled':''}>−</button>
          <span class="ctlCount">${n}</span>
          <button class="ctlBtn" data-n="${escapeHtml(c.n)}" data-d="1"${(n>=MAX_COPIES||ct>=DECK_SIZE)?' disabled':''}>＋</button>
        </div>`;
    return `<div class="deckCardWrap${n?' inDeck':''}">
      <div class="card${side==="zombie"?' zSide':''}${rarityClass(c)}${isCoreCard(c.n)?' coreCard':''}" data-name="${escapeHtml(c.n)}" title="${isCoreCard(c.n)?'Core Set — you own 4 copies':''}">${cardFaceMarkup(c)}${coreBadgeHtml(c.n)}${n?`<div class="haveBadge">×${n}</div>`:""}</div>
      ${ctl}</div>`;
  }).join("");
  $("deckBody").innerHTML=`<div class="deckEditorLayout">${deckContentsHtml(side,deck,ro)}<div class="deckPoolArea">${meta}<div class="compGrid deckGrid">${grid}</div></div></div>`;
  if(ro){
    $("dCopyBtn").onclick=()=>duplicateDeck(side,deck,"My "+(side==="plant"?"Otherworld":"Regime")+" Deck");
  } else {
    $("dRenameBtn").onclick=()=>renameDeckPrompt(side,id);
    $("dCopyBtn").onclick=()=>duplicateDeck(side,deck,deck.name+" copy");
    $("dDelBtn").onclick=()=>deleteDeckPrompt(side,id);
  }
}
function bumpCard(side,id,name,d){
  const deck=DECKS[side].find(x=>x.id===id); if(!deck) return;
  const cur=deck.cards[name]||0, total=deckCount(deck.cards);
  if(d>0 && (cur>=MAX_COPIES || total>=DECK_SIZE)) return;
  const next=Math.max(0,cur+d);
  if(next===0) delete deck.cards[name]; else deck.cards[name]=next;
  saveDecks(); renderDeckEditor();
}
function duplicateDeck(side,src,name){
  const d={id:newDeckId(), name, cards:{...src.cards}};
  DECKS[side].push(d); saveDecks();
  deckEd={side,id:d.id}; renderDeckEditor();
}
function renameDeckPrompt(side,id){
  const deck=DECKS[side].find(x=>x.id===id); if(!deck) return;
  $("overlayCard").innerHTML=`<h2>✏️ Rename deck</h2>
    <input id="dNameInput" class="dInput" maxlength="24" value="${escapeHtml(deck.name)}">
    <div class="confirmRow"><button id="rnCancel" class="secondary">Cancel</button><button id="rnOk">Save</button></div>`;
  $("overlay").classList.remove("hidden");
  const inp=$("dNameInput"); inp.focus(); inp.select();
  $("rnCancel").onclick=()=>{ $("overlay").classList.add("hidden"); };
  $("rnOk").onclick=()=>{
    const v=inp.value.trim();
    if(v) deck.name=v;
    saveDecks(); $("overlay").classList.add("hidden"); renderDeckEditor();
  };
}
function deleteDeckPrompt(side,id){
  const deck=DECKS[side].find(x=>x.id===id); if(!deck) return;
  $("overlayCard").innerHTML=`<div class="big">🗑</div><h2>Delete “${escapeHtml(deck.name)}”?</h2><p>No undo.</p>
    <div class="confirmRow"><button id="delCancel" class="secondary">Cancel</button><button id="delOk" class="danger">Delete</button></div>`;
  $("overlay").classList.remove("hidden");
  $("delCancel").onclick=()=>{ $("overlay").classList.add("hidden"); };
  $("delOk").onclick=()=>{
    DECKS[side]=DECKS[side].filter(x=>x.id!==id);
    saveDecks(); $("overlay").classList.add("hidden");
    deckEd=null; renderDeckScreen();
  };
}

/* ============ SCREENS ============ */
function showScreen(id){
  ["homeScreen","compendiumScreen","deckScreen","app"].forEach(sid=>{
    $(sid).classList.toggle("hidden", sid!==id);
  });
}

/* ============ WIRE UP ============ */
$("endBtn").onclick=endPhase;
$("newBtn").onclick=confirmNewGame;
$("homeBtn").onclick=goHome;
$("hand").addEventListener("scroll",updateHandFade);
$("helpBtn").onclick=showHelp;
$("hintBar").onclick=cancelSel;
$("logBar").onclick=showLogHistory;
$("mullBtn").onclick=doMulligan;
$("zombieBar").onclick=()=>onHeroTap("zombie");
$("plantBar").onclick=()=>onHeroTap("plant");
$("playBtn").onclick=startHotseat;
$("aiBtn").onclick=showAiSidePicker;
$("decksBtn").onclick=showDeckScreen;
$("deckBackBtn").onclick=()=>{
  if(deckEd){ deckEd=null; renderDeckScreen(); }
  else showScreen("homeScreen");
};
/* one delegated handler for the whole deck screen — it re-renders its innerHTML a lot */
$("deckBody").addEventListener("click", e=>{
  const ctl=e.target.closest(".ctlBtn");
  if(ctl && !ctl.disabled && deckEd){ bumpCard(deckEd.side,deckEd.id,ctl.dataset.n,+ctl.dataset.d); return; }
  if(e.target.closest(".cardCtl")) return;
  const dcRow=e.target.closest(".dcClickable");
  if(dcRow && deckEd){ bumpCard(deckEd.side,deckEd.id,dcRow.dataset.n,-1); return; }
  const cardEl=e.target.closest(".card");
  if(cardEl){ const c=ALL_CARDS[cardEl.dataset.name]; if(c) zoomCard(c); return; }
  const nb=e.target.closest(".dNewBtn");
  if(nb){
    const side=nb.dataset.side;
    const d={id:newDeckId(), name:"New Deck", cards:{}};
    DECKS[side].push(d); saveDecks();
    deckEd={side,id:d.id}; renderDeckEditor();
    return;
  }
  const row=e.target.closest(".deckRow");
  if(row){ deckEd={side:row.dataset.side, id:row.dataset.id}; renderDeckEditor(); }
});
$("resumeBtn").onclick=resumeGame;
$("compendiumBtn").onclick=()=>{ renderCompendium(); showScreen("compendiumScreen"); };
$("compendiumScreen").querySelector(".screenBody").addEventListener("click", e=>{
  const cardEl=e.target.closest(".card");
  if(!cardEl) return;
  const card=ALL_CARDS[cardEl.dataset.name];
  if(card) zoomCard(card);
});
$("compBackBtn").onclick=()=>showScreen("homeScreen");
if(loadSave()) $("resumeBtn").classList.remove("hidden");
showScreen("homeScreen");
</script>
</body>
</html>
