<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Garden Brawl — Lane Battler</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #1c2a1e 0%, #10160f 70%);
    color:#e8e6d8; display:flex; flex-direction:column;
  }
  .screen { display:flex; flex-direction:column; height:100%; max-width:520px; margin:0 auto; width:100%; }
  .hidden { display:none !important; }

  /* mouse affordance for desktop; harmless on touch */
  .card, .cell, .herobar, button.btn { cursor:pointer; }

  /* wider frame on desktop/laptop screens so it doesn't look like a stretched phone strip */
  @media (min-width:700px){
    html,body{ overflow:auto; }
    body{ align-items:flex-start; justify-content:center; padding:24px 0; min-height:100%; }
    .screen{
      max-width:640px; height:auto; min-height:calc(100vh - 48px);
      border-radius:18px; border:1px solid #ffffff1c; box-shadow:0 24px 70px #000c;
      overflow:hidden;
    }
    #board{ padding:14px 18px; gap:10px; }
    .row{ gap:10px; }
    .cell .mEmoji{ font-size:32px; }
    .cell .mName{ font-size:9px; height:20px; }
    .cell .mStats{ font-size:13px; }
    .cell .kwDot{ font-size:17px; top:-5px; right:-5px; }
    .card{ flex:0 0 96px; height:132px; }
    .card .cArt{ height:52px; }
    .card .cArt .cEmoji{ font-size:32px; }
    .card .cName{ font-size:10px; }
    .card .cDesc{ font-size:9px; }
    .herobar .face{ width:46px; height:46px; font-size:24px; border-radius:12px; }
    #hand{ padding:6px 4px 10px; }
    #handWrap{ padding:6px 10px 12px; }
  }

  /* hero bars */
  .herobar { display:flex; align-items:center; gap:10px; padding:7px 10px; }
  .herobar .face {
    flex-shrink:0; width:38px; height:38px; border-radius:10px; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 32% 28%, var(--fac-2), var(--fac-3) 70%);
    border:1px solid var(--fac-1); box-shadow:0 2px 8px #0006, inset 0 1px 0 #ffffff22;
  }
  .herobar .stats { display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; }
  .heroNameRow { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .heroNameRow .heroName { font-size:12.5px; font-weight:700; letter-spacing:0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .heroNameRow .heroHpText { font-size:11px; font-weight:700; color:#ffb0b0; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .hpTrack { height:6px; border-radius:4px; background:#00000055; overflow:hidden; box-shadow:inset 0 1px 2px #0008; }
  .hpFill { height:100%; width:100%; border-radius:4px; background:linear-gradient(90deg,#ff6b6b,#ff9b6b); transform-origin:0 50%; transition:transform .45s cubic-bezier(.16,1,.3,1); }
  .heroMetaRow { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .heroMetaItem { display:flex; align-items:center; gap:4px; color:#c7cdba; }
  .heroMetaItem svg { flex-shrink:0; color:var(--fac-1); opacity:0.9; }
  .heroMetaItem .metaNum { font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums; color:#e6e9db; }
  .herobar.targetable { outline:2px solid #ffd75e; border-radius:10px; animation:pulse 0.8s infinite alternate; }
  #zombieBar {
    --fac-1:#c9a2ff; --fac-2:#5c3a8f; --fac-3:#241832;
    background:linear-gradient(180deg,#2b1f33,#1d1526); border-bottom:1px solid #ffffff14; order:0;
    box-shadow:inset 0 -1px 0 #c9a2ff1c;
  }
  #plantBar  {
    --fac-1:#8fbf7a; --fac-2:#3a5c2c; --fac-3:#182410;
    background:linear-gradient(0deg,#1e3020,#152417); border-top:1px solid #ffffff14; order:3;
    box-shadow:inset 0 1px 0 #8fbf7a1c;
  }
  @keyframes pulse { from{outline-color:#ffd75e55;} to{outline-color:#ffd75e;} }

  /* whoever's turn it is sits at the bottom, nearest the player holding the phone —
     the hero bar AND its own lane row flip together so each stays next to its own board half */
  #phaseBanner { order:1; }
  #board { order:2; }
  #zRow { order:0; }
  .laneNums { order:1; }
  #pRow { order:2; }
  body[data-active="zombie"] #zombieBar {
    order:3; border-bottom:none; border-top:1px solid #ffffff14;
    background:linear-gradient(0deg,#2b1f33,#1d1526);
  }
  body[data-active="zombie"] #plantBar {
    order:0; border-top:none; border-bottom:1px solid #ffffff14;
    background:linear-gradient(180deg,#1e3020,#152417);
  }
  body[data-active="zombie"] #zRow { order:2; }
  body[data-active="zombie"] #pRow { order:0; }
  /* these stay pinned after both bars/board regardless of whose turn it is */
  #hintBar { order:4; }
  #logBar { order:5; }
  #handWrap { order:6; }
  #controls { order:7; }

  /* phase banner: turn label + always-visible phase sequence so the zombie split-phase structure is legible */
  #phaseBanner { text-align:center; font-size:11px; padding:3px 3px 4px; color:#c9c39b; background:#00000033; }
  #phaseBanner .turnLabel { letter-spacing:1px; text-transform:uppercase; }
  .phaseSteps { display:flex; justify-content:center; gap:3px; margin-top:2px; font-size:10px; }
  .phaseSteps .step { padding:1px 7px; border-radius:9px; background:#ffffff0d; color:#8b8b7a; border:1px solid transparent; }
  .phaseSteps .step.now { background:#ffd75e22; color:#ffd75e; border-color:#ffd75e66; font-weight:700; }
  .phaseSteps .step.done { opacity:0.45; text-decoration:line-through; }
  .phaseSteps .arrow { color:#ffffff33; }

  /* board */
  #board { flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px; padding:6px 8px; min-height:0; }
  .row { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .cell {
    aspect-ratio:0.78; border-radius:9px; position:relative;
    background:#ffffff08; border:1.5px dashed #ffffff1c;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .row.zrow .cell { background:#3a2b4a22; }
  .row.prow .cell { background:#2b4a2b22; }
  .cell.hasMinion { border-style:solid; border-color:#ffffff33; background:#00000055; }
  /* environments — v1 is literally just a floor tint per the plan (real art later).
     Applied to both side-rows' cells in that lane column, so the "floor" spans the
     whole lane rather than looking tied to one side. Only sets `background` (placed
     after hasMinion so the tint still shows through even with a minion standing on
     it) and deliberately leaves border-color/box-shadow alone, so it never fights
     validSpot/validTarget/attacking below for those properties. */
  .row .cell.envFloorGrove  { background:#2f6b3a66; }
  .row .cell.envFloorScorch { background:#7a3a2a66; }
  .row .cell.envFloorMist   { background:#3a5f7a66; }
  .row .cell.envFloorToxic  { background:#5a6b2a66; }
  .cell.validSpot { border-color:#7fe06d; border-style:solid; box-shadow:0 0 8px #7fe06d55 inset; }
  .cell.validTarget { border-color:#ffd75e; border-style:solid; box-shadow:0 0 8px #ffd75e66 inset; }
  .cell.attacking { border-color:#ff8c42; box-shadow:0 0 14px #ff8c42aa; transform:scale(1.08); transition:all 0.15s; z-index:2; }

  /* death: the losing minion shatters in place instead of instantly vanishing on the next render */
  @keyframes shatterOut {
    0% { transform:scale(1) rotate(0deg); opacity:1; }
    25% { transform:scale(1.08) rotate(-2deg); }
    100% { transform:scale(0.32) rotate(9deg); opacity:0; }
  }
  @keyframes shatterOutDeadly {
    0% { transform:scale(1) rotate(0deg); opacity:1; filter:saturate(1) brightness(1); }
    22% { transform:scale(1.12) rotate(-3deg); filter:saturate(1.8) brightness(1.3); }
    100% { transform:scale(0.28) rotate(-11deg); opacity:0; filter:saturate(2.2) brightness(0.6); }
  }
  .cell.dying { animation:shatterOut 320ms cubic-bezier(0.4,0,1,1) forwards; z-index:3; pointer-events:none; }
  .cell.dying.dyingDeadly { animation-name:shatterOutDeadly; animation-duration:360ms; }

  /* impact sparks: land on the cell that took the hit, shaped by what the hit was */
  @keyframes impactPop {
    0% { transform:translate(-50%,-50%) scale(0.35); opacity:0; }
    35% { opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1.5); opacity:0; }
  }
  @keyframes shieldRing {
    0% { transform:translate(-50%,-50%) scale(0.4); opacity:0.95; }
    100% { transform:translate(-50%,-50%) scale(1.7); opacity:0; }
  }
  .impactFx { position:fixed; z-index:60; pointer-events:none; width:44px; height:44px; border-radius:50%; }
  .impactFx--normal { background:radial-gradient(circle, #fff6d0 0%, #ffd75e99 45%, transparent 72%); animation:impactPop 360ms cubic-bezier(0.16,1,0.3,1) forwards; }
  .impactFx--deadly {
    width:54px; height:54px;
    background:radial-gradient(circle, #eaffe6 0%, #a366ffb0 42%, #2a0a3a66 72%, transparent 82%);
    animation:impactPop 460ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .impactFx--deadly::after {
    content:"☠️"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:19px; filter:drop-shadow(0 0 4px #000);
  }
  .impactFx--armored { background:transparent; border:3px solid #8fd0ff; box-shadow:0 0 10px #8fd0ffaa; animation:shieldRing 380ms cubic-bezier(0.16,1,0.3,1) forwards; }

  /* strikethrough: a beam literally passes through, from the attacking minion's cell to the hero bar */
  @keyframes pierceGrow { 0%{ transform:scaleX(0); opacity:0; } 25%{ opacity:1; } 100%{ transform:scaleX(1); opacity:0; } }
  .pierceBeamWrap { position:fixed; height:0; z-index:59; pointer-events:none; transform-origin:0 50%; }
  .pierceBeam { position:absolute; left:0; top:-2px; height:4px; width:100%; border-radius:2px; transform-origin:0 50%;
    background:linear-gradient(90deg,#ffb95e,#fff6d0 55%,transparent); box-shadow:0 0 8px #ffb95eaa;
    animation:pierceGrow 380ms cubic-bezier(0.16,1,0.3,1) forwards; }

  /* frenzy: a delayed, lobbed bonus hit — thrown, not a straight pass-through */
  .frenzyArc { position:fixed; z-index:60; pointer-events:none; font-size:25px; filter:drop-shadow(0 0 6px #ff6a3dcc);
    animation:frenzyArcMove 560ms cubic-bezier(0.3,0.6,0.3,1) forwards; }
  @keyframes frenzyArcMove {
    0% { transform:translate(0,0) scale(0.7) rotate(-10deg); opacity:0; }
    14% { opacity:1; }
    55% { transform:translate(var(--dxh),calc(var(--dyh) - 46px)) scale(1.15) rotate(8deg); }
    100% { transform:translate(var(--dx),var(--dy)) scale(0.85) rotate(20deg); opacity:0; }
  }

  /* combat call-out tags: a short readable label riding along with the deadly/strikethrough/
     frenzy fx above, so what just happened is obvious without reading the log line */
  .fxTag {
    position:fixed; z-index:66; pointer-events:none;
    transform:translate(-50%,-70%) scale(0.5); opacity:0;
    font-size:10.5px; font-weight:800; letter-spacing:0.03em; text-transform:uppercase; white-space:nowrap;
    padding:3px 9px; border-radius:7px;
    animation:fxTagPop 900ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes fxTagPop {
    0%   { transform:translate(-50%,-70%) scale(0.5); opacity:0; }
    18%  { transform:translate(-50%,-100%) scale(1.08); opacity:1; }
    30%  { transform:translate(-50%,-100%) scale(1); opacity:1; }
    78%  { transform:translate(-50%,-100%) scale(1); opacity:1; }
    100% { transform:translate(-50%,-130%) scale(0.85); opacity:0; }
  }
  .fxTag--deadly  { background:#1c0a2ae0; border:1px solid #a366ff; color:#eaffe6; box-shadow:0 0 10px #a366ff77; }
  .fxTag--strike  { background:#2a1a06e0; border:1px solid #ffb95e; color:#fff6d0; box-shadow:0 0 10px #ffb95e77; }
  .fxTag--frenzy  { background:#2a1004e0; border:1px solid #ff6a3d; color:#ffe2d0; box-shadow:0 0 10px #ff6a3d77; }

  /* trick cast preview: pops up over the target, holds for a couple seconds so its
     effect text is actually readable, then blips out. Duration lives in one place —
     the JS setTimeout() removal below — keep the keyframe percentages in sync with it. */
  .trickPreview {
    position:fixed; z-index:65; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    animation: tpPop 2600ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .trickPreview .tpArt {
    width:64px; height:64px; border-radius:12px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 35%, #ffffff26, #00000060 78%);
    border:2px solid #c9a2ff; box-shadow:0 4px 14px #000b, 0 0 14px #c9a2ff66;
    display:flex; align-items:center; justify-content:center;
  }
  .trickPreview .tpArt img { width:100%; height:100%; object-fit:cover; display:block; }
  .trickPreview .tpArt .tpEmoji { font-size:32px; filter:drop-shadow(0 2px 3px #0009); }
  .trickPreview .tpName {
    font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 3px #000;
    background:#00000090; padding:2px 8px; border-radius:8px; white-space:nowrap;
  }
  .trickPreview .tpDesc {
    font-size:10px; font-weight:600; color:#e8e6d8; text-align:center; line-height:1.3;
    background:#000000a8; border:1px solid #ffffff22; padding:4px 8px; border-radius:8px;
    max-width:150px;
  }
  @keyframes tpPop {
    0%   { transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    6%   { transform:translate(-50%,-64%) scale(1.05); opacity:1; }
    10%  { transform:translate(-50%,-64%) scale(1); opacity:1; }
    92%  { transform:translate(-50%,-64%) scale(1); opacity:1; }
    100% { transform:translate(-50%,-64%) scale(0.6); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .impactFx, .pierceBeam, .frenzyArc, .cell.dying, .trickPreview, .fxTag { animation-duration:1ms !important; }
  }

  .cell .mEmoji { font-size:26px; line-height:1.1; }
  .cell .mName { font-size:8px; text-align:center; opacity:0.85; padding:0 2px; line-height:1.1; height:18px; overflow:hidden; }
  .cell .mStats { display:flex; gap:4px; font-size:11px; font-weight:700; }
  .cell .mStats .a { color:#ffb95e; } .cell .mStats .h { color:#7fe06d; }
  .cell .kwDot {
    position:absolute; top:-4px; right:-4px; font-size:15px; line-height:1;
    display:flex; gap:1px; z-index:3; filter:drop-shadow(0 1px 2px #000d);
    background:#0a0a0acc; border:1.5px solid #ffffff55; border-radius:9px;
    padding:1px 3px;
  }
  .cell.hasMinion { cursor:pointer; }
  .laneNums { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; text-align:center; font-size:9px; color:#ffffff44; }
  .laneEnvTag { margin-left:2px; font-size:11px; filter:drop-shadow(0 1px 2px #000d); }

  /* floating damage */
  .floater { position:fixed; font-size:20px; font-weight:800; pointer-events:none; z-index:50; animation:floatUp 0.9s forwards; text-shadow:0 1px 3px #000; }
  @keyframes floatUp { from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-34px);} }

  /* hint + log */
  #hintBar { padding:4px 10px; font-size:12px; min-height:22px; color:#ffd75e; text-align:center; }
  #logBar { padding:2px 10px 4px; font-size:10px; color:#9aa88f; text-align:center; min-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  #logBar:not(:empty)::after { content:" ⌄"; color:#ffffff55; }

  /* hand */
  #handWrap { padding:4px 6px 8px; }
  #hand { display:flex; gap:6px; overflow-x:auto; padding:4px 2px 6px; -webkit-overflow-scrolling:touch; }
  /* edge fade is applied dynamically via JS (mask-image) when the hand scrolls off-screen */
  .card {
    flex:0 0 74px; height:104px; border-radius:10px; padding:3px 3px 4px;
    background:linear-gradient(180deg,#2f3d2a,#182016);
    border:1.5px solid #8fbf7a4d;
    box-shadow:0 2px 6px #0007, inset 0 1px 0 #ffffff14;
    display:flex; flex-direction:column; align-items:center; position:relative;
  }
  body[data-active="zombie"] .card { background:linear-gradient(180deg,#3a2f47,#201827); border-color:#c9a2ff42; }
  /* rarity border accents (common = the plain faction-tinted look above, unchanged).
     !important on border-color because plainer, higher-specificity context rules
     (compendium/deck-builder ID-scoped faction tints below) would otherwise win —
     rarity should read the same color everywhere a card shows up. The interaction
     states just below (unplayable/selected/validHandTarget) get their own
     !important so they still visibly take over on top of a rare+ card in hand. */
  .card.rarity-rare { border-color:#4aa8ff !important; box-shadow:0 2px 6px #0007, inset 0 1px 0 #ffffff14, 0 0 6px #4aa8ff66; }
  .card.rarity-epic { border-color:#c964f0 !important; box-shadow:0 2px 6px #0007, inset 0 1px 0 #ffffff14, 0 0 6px #c964f066; }
  .card.rarity-legendary { border-color:#ff9645 !important; border-width:2px; box-shadow:0 2px 6px #0007, inset 0 1px 0 #ffffff14, 0 0 8px #ff964588; }
  /* art window: shows a mapped custom image if one exists, otherwise the card's emoji */
  .card .cArt {
    width:calc(100% - 6px); height:38px; margin-top:6px; border-radius:6px; flex:0 0 auto;
    background:radial-gradient(ellipse at 50% 35%, #ffffff1e, #00000048 78%);
    border:1px solid #ffffff1f; box-shadow:inset 0 1px 4px #0008;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .card .cArt .cEmoji { font-size:24px; margin:0; filter:drop-shadow(0 2px 2px #0009); }
  .card .cArt img { width:100%; height:100%; object-fit:cover; display:block; }
  .cell img.mArt { width:34px; height:34px; border-radius:50%; object-fit:cover; border:1px solid #ffffff2e; }
  .card.unplayable { opacity:0.62; filter:grayscale(0.65) brightness(0.8); }
  .card.unplayable::after { content:"🔒"; position:absolute; top:2px; right:3px; font-size:11px; filter:none; text-shadow:0 1px 2px #000; }
  .card.selected { border-color:#ffd75e !important; box-shadow:0 0 10px #ffd75e77; transform:translateY(-6px); }
  .card.validHandTarget { border-color:#7fe06d !important; border-style:solid; box-shadow:0 0 8px #7fe06d66; }
  .card .cost {
    position:absolute; top:-6px; left:-5px; width:20px; height:20px; z-index:2;
    background:linear-gradient(135deg,#f5dd7a,#c9a437); color:#221c07;
    transform:rotate(45deg); border-radius:5px;
    box-shadow:0 1px 3px #000c, inset 0 1px 0 #ffffff88;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;
  }
  .card .cost span { transform:rotate(-45deg); }
  .card .cName { font-size:8.5px; font-weight:700; text-align:center; line-height:1.1; margin-top:3px; width:calc(100% - 4px); background:#00000042; border-radius:4px; padding:1px 2px; }
  .card .cDesc { font-size:7.5px; text-align:center; color:#b8c4a8; line-height:1.15; margin-top:1px; flex:1; overflow:hidden; }
  .card .cStats { font-size:10px; font-weight:800; display:flex; gap:6px; }
  .card .cStats .a { color:#ffb95e; } .card .cStats .h { color:#7fe06d; }
  .card .trickTag { font-size:7.5px; color:#c9a2ff; font-weight:700; }
  .card .trickTag.envTag { color:#9fd08a; }

  /* controls */
  #controls { display:flex; gap:8px; padding:0 10px 10px; align-items:center; }
  button.btn {
    flex:1; padding:11px; min-height:46px; border-radius:10px; border:none; font-size:14px; font-weight:700;
    background:linear-gradient(180deg,#5a8f4d,#3f6b35); color:#fff; box-shadow:0 2px 0 #2a4a24;
  }
  button.btn:active { transform:translateY(1px); }
  button.btn.small { flex:0 0 auto; padding:11px 14px; min-width:46px; min-height:46px; background:linear-gradient(180deg,#555,#3a3a3a); box-shadow:0 2px 0 #2a2a2a; font-size:12px; }
  body[data-active="zombie"] button.btn:not(.small):not(.dNewBtn) { background:linear-gradient(180deg,#7a5aa0,#5a3f7a); box-shadow:0 2px 0 #3d2a55; }

  /* home screen */
  #homeScreen { align-items:center; justify-content:center; gap:20px; padding:32px 28px; text-align:center; }
  #homeScreen .homeFaces { display:flex; gap:22px; font-size:50px; line-height:1; }
  #homeScreen .homeFaces span { filter:drop-shadow(0 4px 10px #0008); }
  #homeScreen h1 { font-size:30px; font-weight:800; letter-spacing:-0.02em; }
  #homeScreen .tagline { font-size:13px; color:#b8c4a8; max-width:280px; line-height:1.5; }
  #homeScreen .homeButtons { display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px; margin-top:6px; }
  #homeScreen .homeBtn {
    width:100%; padding:15px; border-radius:12px; border:none; font-size:16px; font-weight:700; color:#fff;
  }
  #homeScreen .homeBtn:active { transform:translateY(1px); }
  #homeScreen .homeBtn.primary { background:linear-gradient(180deg,#5a8f4d,#3f6b35); box-shadow:0 3px 0 #2a4a24, 0 10px 24px #0006; }
  #homeScreen .homeBtn.secondary { background:#ffffff12; border:1.5px solid #ffffff2e; box-shadow:none; color:#e8e6d8; }

  /* compendium + deck builder (shared screen chrome) */
  #compendiumScreen, #deckScreen { height:100%; }
  #compendiumScreen .screenHeader, #deckScreen .screenHeader {

  /* the zoomed-card modal (Compendium tap / board tap) recolors purple for a Regime card,
     instead of always defaulting to the Otherworld's green — matches the purple accent
     already used everywhere else a Regime card/side shows up (hand cards, buttons, etc.) */
  #overlayCard.zSide { background:#241c30; border-color:#c9a2ff42; }

  #overlayCard.rarity-rare { border-color:#4aa8ff !important; box-shadow:0 0 16px #4aa8ff44; }

  /* deck contents panel — always-visible "what's in this deck" list, separate from

  .deckEditorLayout { display:flex; flex-direction:column; gap:14px; }

  .dcTitle {

  .dcList { display:flex; flex-direction:column; gap:4px; max-height:220px; overflow-y:auto; }

  .dcRow.dcClickable { cursor:pointer; }
  .dcRow.dcClickable:active { background:#ff6b6b22; }
  .dcCost {
    flex:0 0 auto; width:18px; height:18px; border-radius:5px;
    background:linear-gradient(135deg,#f5dd7a,#c9a437); color:#221c07;

  @media (min-width:700px){

    .dcList { max-height:calc(100vh - 170px); }

  /* scry picker */

  .scryRow { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  #overlayCard .scryCard { position:relative; cursor:pointer; transition:transform .12s ease, border-color .12s ease; }
  #overlayCard .scryCard:active { transform:scale(0.94); border-color:#ffd75e; }
</style>

<script>
"use strict";
/* ============ CARD DATA ============ */
/* CUSTOM CARD ART
   Draw a card, add the image file to an art/ folder in the repo, then map the exact card
   name to its path here. Any card without an entry keeps its emoji. Square-ish images look
   best (cropped to fit). Small thumbnails also appear on the board when the minion is placed.
   Example:  const CARD_ART = { "Foot Soldier":"art/foot-soldier.png", "Nut Wall":"art/nut-wall.jpg" };  */
const CARD_ART = { "Communist Manifesto":"art/communist-manifesto.png" };
function artFor(name){ return CARD_ART[name] || null; }

/* CARD FLAVOR
   A short quote or line of lore per card, shown in the Compendium's zoomed-in view
   (in addition to, not instead of, the card's mechanical text). Cards without an
   entry here just skip the flavor line. */
const CARD_FLAVOR = {
  "Squire": "Everyone starts somewhere, even legends.",
  "Wandering Bard": "Every tale needs a witness. Preferably one who survives it.",
  "Stone Golem": "Given shape by magic, held together by stubbornness.",
  "Rogue": "Gone before the guard finishes the sentence.",
  "Goblin Raider": "Small, fast, and everywhere at once.",
  "Dwarven Defender": "This ground has an owner, and it isn't you.",
  "Pyromancer": "Spellbooks are heavy. Fire is not.",
  "Berserker": "Strategy is for people who plan on losing.",
  "Plate Knight": "Sworn to a code older than the kingdom.",
  "Ranger": "The forest already told them you were coming.",
  "Ancient Dragon": "Kingdoms rise and fall. It just keeps sleeping.",
  "Blessing": "Luck, borrowed from somewhere kinder.",
  "Fireball": "Level one spell. Still ends most arguments.",
  "Divination": "The future is easier to read than the present.",
  "Lay on Hands": "Some wounds close faster with the right words.",
  "Banish": "Not gone. Just... elsewhere.",
  "Foot Soldier": "First to the line, first to be replaced.",
  "Agitator": "A rumor with legs.",
  "Bureaucrat": "The stamp matters more than what's stamped.",
  "Checkpoint Guard": "Papers, please.",
  "Informant": "Everyone talks eventually.",
  "Propagandist": "Say it loud enough and it becomes true.",
  "Saboteur": "In and out before the alarm sounds.",
  "Shock Trooper": "Doesn't stop when the first target falls.",
  "Riot Police": "The line does not break. The line is the point.",
  "Cavalry Charge": "By the time you see it, it's already past you.",
  "Iron Curtain": "Nothing gets through. Nothing gets out.",
  "Communist Manifesto": "“A spectre is haunting Europe.”",
  "Blitzkrieg": "Speed is a weapon before it's a strategy.",
  "Requisition": "Everything belongs to the state, eventually.",
  "Purge": "Simplest way to solve a disagreement.",
  "Show Trial": "The verdict was decided before the trial began.",
  "Transfigure": "One shape is as good as another, if you squint.",
  "Reassignment": "The state finds new uses for everything."
};
function flavorFor(card){ return CARD_FLAVOR[card.n] || ""; }

const KWNAME = { deadly:"☠️Deadly", armored:"🛡️Armored 1", strike:"⤳Strikethrough", frenzy:"🔥Frenzy" };
const KWDESC = {
  deadly:"☠️ Deadly: destroys any minion it damages",
  armored:"🛡️ Armored 1: takes 1 less damage from attacks",
  strike:"⤳ Strikethrough: attacks hit the minion AND the hero",
  frenzy:"🔥 Frenzy: after killing a minion, attacks the hero too"
};
function M(n,e,c,a,h,kw,op,d,r){ return {t:"m",n,e,c,a,h,kw:kw||[],op:op||null,d:d||"",r:r||null}; }
function T(n,e,c,fx,d,r){ return {t:"t",n,e,c,fx,d,r:r||null}; }
/* ENVIRONMENTS — a third card type. Played onto a LANE (not either side's row) like a
   minion, but occupies its own slot per lane and doesn't care who owns what's already
   there. Right before combat resolves in that lane, the environment triggers its effect
   against whatever's currently occupying the lane, then combat proceeds as normal.
   Playing a new environment onto a lane that already has one replaces (voids) the old
   one outright — no swap-back, no returning it to a hand or deck.
   fx.k values: "envAllHp"/"envAllAtk" apply to BOTH sides' minions in the lane (n can be
   negative); "envEnemyAtk"/"envEnemyHp" apply only to the minion belonging to whichever
   side did NOT play the environment (relative to env.side, set when it's played).
   `r` = rarity (common/rare/epic/legendary) — G asked to always be asked for this on new
   cards; stored on the card but not yet rendered anywhere (no rarity UI built yet). */
function E(n,e,c,fx,d,r){ return {t:"e",n,e,c,fx,d,r:r||null}; }

/* FACTION IDENTITY (first pass, deliberately modest — rebalance freely):
   The Otherworld leans DEFENSIVE — tougher bodies, healing, defensive buff.
   Regime leans AGGRESSIVE — bigger attack on glass bodies, AoE damage, offensive buff. */
/* the "Otherworld" faction — D&D/isekai fantasy theme, the opposite of Regime's
   grounded reality: magic and myth instead of history and government. Same

/* lookup by name for the Compendium's zoomed-in card view */
const ALL_CARDS = {};
[...PLANT_POOL, ...ZOMBIE_POOL].forEach(c => { ALL_CARDS[c.n] = c; });

/* CORE SET — the 32 cards that exist right now, which we own 4 full copies of.
   Hardcoded as a frozen snapshot (NOT derived from PLANT_POOL/ZOMBIE_POOL) so that
   any card added to the pools *after* this line automatically falls outside the
   Core Set — future cards won't silently inherit the "own 4" marking just by
   existing in the array. Cards get the light-grey ring wherever their face is
   shown in a browsing context (Compendium, Deck Builder pool). Named "Core Set"
   rather than "Starter" to avoid colliding with the existing Starter *Deck*
   preset, which is an unrelated concept (a specific 40-card build, not ownership). */
const CORE_SET = new Set([
  "Squire","Wandering Bard","Stone Golem","Rogue","Goblin Raider","Dwarven Defender",
  "Pyromancer","Berserker","Plate Knight","Ranger","Ancient Dragon",
  "Blessing","Fireball","Divination","Lay on Hands","Banish",
  "Foot Soldier","Agitator","Bureaucrat","Checkpoint Guard","Informant","Propagandist",
  "Saboteur","Shock Trooper","Riot Police","Cavalry Charge","Iron Curtain",
  "Communist Manifesto","Blitzkrieg","Requisition","Purge","Show Trial"
]);
function isCoreCard(name){ return CORE_SET.has(name); }
const MAX_COPIES_OWNED = 4;
/* how many of a card we own — everything in the Core Set is owned at the deck-build
   cap (4); future non-core cards default to 0 until an unlock system exists. Used
   today just to drive the visual marker; deckbuilding itself doesn't gate on it yet. */
function ownedCopies(name){ return isCoreCard(name) ? MAX_COPIES_OWNED : 0; }
/* the actual visible "you own N of these" marker — G flagged that the cost diamond
   (top-left, mana cost) was easy to mistake for a copies-owned count since nothing
   else showed that number on the card face. This sits opposite it, top-right. */
function coreBadgeHtml(name){ return isCoreCard(name) ? `<div class="ownBadge">×${MAX_COPIES_OWNED}</div>` : ""; }
/* rarity border — common cards (the vast majority, including unset/undefined `r`)
   get no extra class and keep the plain faction-tinted card look; rare/epic/legendary
   get a colored border via the matching .rarity-X CSS rule, wherever the card renders */
function rarityClass(card){ return (card.r && card.r!=="common") ? ` rarity-${card.r}` : ""; }

/* ============ DECKS ============ */
/* PvZ-Heroes-style deckbuilding: every deck is exactly 40 cards, max 4 copies of
   any one card, faction-locked. Decks are stored as name→count maps so future
   card pool changes don't invalidate the storage format. The starter decks are
   built-in (not stored, not editable) and always available. */
const DECK_SIZE = 40, MAX_COPIES = 4;
const STARTER_DECKS = {
  /* curve-minded defaults from the current pool: 4x the cheap core, 2x the top end.
     Cavalry Charge held at 2 on purpose — it's on the balance watchlist. */
  plant: {
    "Squire":4, "Wandering Bard":3, "Stone Golem":2, "Rogue":2, "Goblin Raider":3,
    "Dwarven Defender":3, "Pyromancer":3, "Berserker":2, "Plate Knight":3, "Ranger":2,
    "Ancient Dragon":2, "Blessing":3, "Fireball":3, "Divination":2, "Lay on Hands":2, "Banish":1
  },
  zombie: {
    "Foot Soldier":4, "Agitator":3, "Bureaucrat":3, "Checkpoint Guard":2, "Informant":2,
    "Propagandist":3, "Saboteur":3, "Shock Trooper":2, "Riot Police":3, "Cavalry Charge":2,
    "Iron Curtain":2, "Communist Manifesto":3, "Blitzkrieg":3, "Requisition":2, "Purge":2, "Show Trial":1
  }
};
const DECKS_KEY = "gardenBrawlDecks";
function loadDecks(){
  try{
    const d = JSON.parse(localStorage.getItem(DECKS_KEY));
    return (d && Array.isArray(d.plant) && Array.isArray(d.zombie)) ? d : {plant:[], zombie:[]};
  }catch(e){ return {plant:[], zombie:[]}; }
}
let DECKS = loadDecks();
function saveDecks(){ try{ localStorage.setItem(DECKS_KEY, JSON.stringify(DECKS)); }catch(e){} }
function poolFor(side){ return side==="plant" ? PLANT_POOL : ZOMBIE_POOL; }
function starterDeck(side){ return {id:"starter", name:"Starter Deck", cards:{...STARTER_DECKS[side]}, starter:true}; }
function allDecks(side){ return [starterDeck(side), ...DECKS[side]]; }
function getDeck(side,id){ return allDecks(side).find(d=>d.id===id) || starterDeck(side); }
function deckCount(cards){ return Object.values(cards).reduce((a,b)=>a+b,0); }
function deckValid(side,cards){
  if(deckCount(cards)!==DECK_SIZE) return false;
  return Object.entries(cards).every(([n,ct])=>
    ct>=1 && ct<=MAX_COPIES && poolFor(side).some(c=>c.n===n));
}
function playableDecks(side){ return allDecks(side).filter(d=>deckValid(side,d.cards)); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const otherSide = s => s==="plant" ? "zombie" : "plant";
let S = null;
let uiLock = false;
function P(s){ return S.players[s]; }
function sideName(s){ return s==="plant" ? "⚔️ Otherworld" : "🎖️ Regime"; }
function kwSymbols(m){ return m.kw.map(k=>({deadly:"☠️",armored:"🛡️",strike:"⤳",frenzy:"🔥"}[k])).join(""); }

/* ============ SAVE / RESUME ============ */
/* survives an accidental refresh or tab close mid-match; cleared when a game ends */
const SAVE_KEY="gardenBrawlSave";
function saveGame(){
  if(!S || S.over || S.phase==="combat") return; // combat is transient — resume lands on the last stable phase
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s=JSON.parse(raw);
    return (s && s.players && s.lanes && !s.over) ? s : null;
  }catch(e){ return null; }
}
function resumeGame(){
  const s=loadSave();
  if(!s){ $("resumeBtn").classList.add("hidden"); return; }
  S=s; uiLock=false;
  showScreen("app");
  if(isAiGame()){
    // solo game: no pass screen needed; if the save landed mid-AI-turn, restart the AI's phase
    document.body.dataset.active=otherSide(S.aiSide);
    S.handoff=false;
    render();
    if(S.active===S.aiSide && !S.over) aiPhase();
  } else {
    document.body.dataset.active=S.active;
    showHandoff(); // re-show the pass screen so nobody's hand is exposed on resume
    render();
  }
}

/* ============ GAME SETUP ============ */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function buildDeckFrom(side,cards){
  const deck=[];
  Object.entries(cards).forEach(([n,ct])=>{
    const c=ALL_CARDS[n]; if(!c) return;
    for(let i=0;i<ct;i++) deck.push({...c});
  });
  return shuffle(deck);
}
function newGame(mode,aiSide,deckIds){
  deckIds=deckIds||{};
  const ids={ plant:deckIds.plant||"starter", zombie:deckIds.zombie||"starter" };
  // fall back to the starter if a chosen deck was deleted or edited below 40 since
  ["plant","zombie"].forEach(s=>{
    const d=allDecks(s).find(x=>x.id===ids[s]);
    if(!d || !deckValid(s,d.cards)) ids[s]="starter";
  });
  S = {
    mode:mode||"hotseat", aiSide:aiSide||null, deckIds:ids,
    turn:0, phase:"idle", active:"zombie", over:false, sel:null, log:[],
    mull:{plant:true,zombie:true}, acted:{plant:false,zombie:false},
    lanes: Array.from({length:5},()=>({plant:null,zombie:null,env:null})),
    players:{
      plant:{hp:20,res:0,deck:buildDeckFrom("plant",getDeck("plant",ids.plant).cards),hand:[]},
      zombie:{hp:20,res:0,deck:buildDeckFrom("zombie",getDeck("zombie",ids.zombie).cards),hand:[]}
    }
  };
  draw("plant",4); draw("zombie",4);
  nextTurn();
}
function draw(side,n){
  for(let i=0;i<n;i++){
    const p=P(side);
    if(p.deck.length===0){ addLog(sideName(side)+" deck empty — no draw"); return; }
    if(p.hand.length>=10){ p.deck.shift(); addLog(sideName(side)+" hand full — card burned"); continue; }
    p.hand.push(p.deck.shift());
  }
}
function nextTurn(){
  S.turn++;
  ["plant","zombie"].forEach(s=>{ P(s).res=Math.min(S.turn,10); draw(s,1); });
  startPhase("z1");
}
function startPhase(ph){
  S.phase=ph; S.sel=null;
  S.active = ph==="p" ? "plant" : "zombie";
  // solo mode: the human's side stays at the bottom the whole game — no board flipping,
  // no pass-the-phone screens; the AI's phases run themselves
  if(isAiGame()){
    S.handoff=false;
    document.body.dataset.active=otherSide(S.aiSide);
    render();
    if(S.active===S.aiSide && !S.over) aiPhase();
  } else {
    document.body.dataset.active=S.active;
    showHandoff();
    render();
  }
}
function isAiGame(){ return S && S.mode==="ai"; }
function isAiTurn(){ return isAiGame() && S.active===S.aiSide; }
function endPhase(){
  if(uiLock||S.over||S.phase==="combat") return;
  if(S.phase==="z1") startPhase("p");
  else if(S.phase==="p") startPhase("z2");
  else if(S.phase==="z2") combat();
}

/* one free redraw per player, only on turn 1 before they've played anything.
   Regime's window is its first phase (z1) so it can't mulligan after seeing the Otherworld's turn. */
function canMulligan(){
  return S && !S.over && S.turn===1 && S.mull && S.mull[S.active] && !S.acted[S.active] &&
    (S.active==="plant" ? S.phase==="p" : S.phase==="z1");
}
function doMulligan(){
  if(uiLock||!canMulligan()) return;
  const p=P(S.active), n=p.hand.length;
  p.deck.push(...p.hand.splice(0));
  shuffle(p.deck);
  draw(S.active,n);
  S.mull[S.active]=false;
  addLog(`${sideName(S.active)} mulligans (${n} cards)`);
  hint("New hand drawn — no redos!");
  S.sel=null; render();
}

/* ============ PLAYING CARDS ============ */
function canPlayCard(card){
  if(card.c > P(S.active).res) return false;
  // environments aren't minions or tricks — Regime can drop one in either of its phases
  if(S.phase==="z1" && card.t!=="m" && card.t!=="e") return false;
  if(S.phase==="z2" && card.t!=="t" && card.t!=="e") return false;
  if(card.t==="m") return S.lanes.some(l=>!l[S.active]);
  if(card.t==="e") return true; // any lane is a valid target — it just replaces what's there
  const fx=card.fx;
  if(fx.k==="buff") return S.lanes.some(l=>l[S.active]);
  if(fx.k==="destroy") return S.lanes.some(l=>l[otherSide(S.active)]);
  if(fx.k==="aoe") return S.lanes.some(l=>l[otherSide(S.active)]);
  if(fx.k==="heal") return P(S.active).hp<20;
  if(fx.k==="buffHand") return P(S.active).hand.some(c=>c!==card && c.t==="m");
  if(fx.k==="transfigure") return P(S.active).hand.some(c=>c!==card);
  return true; // dmg (hero always targetable), draw
}
function onCardTap(i){
  if(uiLock||S.over||S.phase==="combat") return;
  const hand=P(S.active).hand;
  const card=hand[i];
  if(!card) return;
  // a hand-targeting trick is already selected — tapping a DIFFERENT minion in hand
  // casts it there, instead of switching the selection to that card
  if(S.sel!==null && S.sel!==i){
    const selCard=hand[S.sel];
    if(selCard && selCard.t==="t" && selCard.fx.k==="buffHand"){
      if(card.t==="m") castTrick(S.sel,{handCardRef:card});
      else cancelSel();
      return;
    }
    if(selCard && selCard.t==="t" && selCard.fx.k==="transfigure"){
      castTrick(S.sel,{handCardRef:card}); // any card type in hand is a valid target
      return;
    }
  }
  if(!canPlayCard(card)){
    if(card.c>P(S.active).res) hint("Not enough "+(S.active==="plant"?"mana 🔷":"decrees 📜"));
    else if(S.phase==="z1"&&card.t==="t") hint("Tricks come later this turn");
    else if(S.phase==="z2"&&card.t==="m") hint("Tricks only in this phase");
    else if(card.t==="t"&&card.fx.k==="heal") hint("Already at full HP");
    else hint("No valid target / no free lane");
    return;
  }
  if(S.sel===i){
    if(card.t==="t"&&["draw","heal","aoe","scry"].includes(card.fx.k)){ castTrick(i,null); return; }
    S.sel=null; render(); return;
  }
  S.sel=i; render();
}
function cancelSel(){ if(S && S.sel!==null && !uiLock){ S.sel=null; render(); } }
function onCellTap(lane,side){
  if(uiLock||S.over) return;
  if(S.sel===null){
    const m=S.lanes[lane][side];
    if(m) zoomPlacedMinion(m);
    return;
  }
  const card=P(S.active).hand[S.sel];
  if(!card) return;
  if(card.t==="m"){
    if(side===S.active && !S.lanes[lane][S.active]) playMinion(S.sel,lane);
    else cancelSel(); // tapped an invalid spot — treat as "never mind"
    return;
  }
  if(card.t==="e"){
    // targets the lane itself, not either side's row — tapping either row's cell for
    // this lane column places it the same way
    playEnvironment(S.sel,lane);
    return;
  }
  const m=S.lanes[lane][side], fx=card.fx;
  if(!m){ cancelSel(); return; }
  if(fx.k==="buff" && side===S.active) castTrick(S.sel,{lane,side});
  else if((fx.k==="dmg"||fx.k==="destroy") && side===otherSide(S.active)) castTrick(S.sel,{lane,side});
  else cancelSel();
}
function onHeroTap(side){
  if(uiLock||S.over||S.sel===null) return;
  const card=P(S.active).hand[S.sel];
  if(card && card.t==="t" && card.fx.k==="dmg" && side===otherSide(S.active)) castTrick(S.sel,{hero:side});
  else cancelSel();
}
function playMinion(idx,lane){
  const card=P(S.active).hand[idx];
  if(S.acted) S.acted[S.active]=true;
  P(S.active).res-=card.c;
  P(S.active).hand.splice(idx,1);
  const m={n:card.n,e:card.e,kw:card.kw,a:card.a,hp:card.h,maxHp:card.h};
  S.lanes[lane][S.active]=m;
  addLog(`${card.e}${card.n} → lane ${lane+1}`);
  S.sel=null; render();
  if(card.op){
    if(card.op.k==="draw") draw(S.active,card.op.n);
    else if(card.op.k==="dmgLane" && S.lanes[lane][otherSide(S.active)])
      damageMinion(lane,otherSide(S.active),card.op.n,{});
    else if(card.op.k==="scry") startScry(S.active,card.op.n);
  }
  render();
}
/* environments occupy their own per-lane slot — independent of which side's minions are
   there. Playing a new one over an existing one replaces it outright (voided, gone for
   good, not returned to a deck or hand). */
function playEnvironment(idx,lane){
  const card=P(S.active).hand[idx];
  if(S.acted) S.acted[S.active]=true;
  P(S.active).res-=card.c;
  P(S.active).hand.splice(idx,1);
  const prev=S.lanes[lane].env;
  if(prev) addLog(`${card.e}${card.n} replaces ${prev.e}${prev.n} in lane ${lane+1} — the old environment is voided`);
  else addLog(`${card.e}${card.n} settles over lane ${lane+1}`);
  S.lanes[lane].env={n:card.n,e:card.e,side:S.active,fx:card.fx};
  S.sel=null;
  render();
}
function castTrick(idx,target){
  const side=S.active, card=P(side).hand[idx], fx=card.fx;
  if(S.acted) S.acted[side]=true;

  // show a brief floating preview of the trick's art/name over wherever it landed —
  // captured before anything moves or gets removed from the board
  let anchorEl=null;
  if(target && target.hero) anchorEl=$(heroBarId(target.hero));
  else if(target && target.lane!==undefined) anchorEl=$(`cell-${target.side}-${target.lane}`);
  else if(fx.k==="heal" || fx.k==="draw" || fx.k==="scry") anchorEl=$(heroBarId(side)); // affects the caster
  else if(fx.k==="aoe") anchorEl=$(heroBarId(otherSide(side)));              // hits the enemy side
  if(anchorEl){
    const r=anchorEl.getBoundingClientRect();
    spawnTrickPreview(card, r.left+r.width/2, r.top+r.height/2);
  }

  P(side).res-=card.c;
  P(side).hand.splice(idx,1);
  addLog(`${card.e}${card.n} cast`);
  S.sel=null;
  if(fx.k==="draw") draw(side,fx.n);
  else if(fx.k==="heal"){
    const p=P(side), healed=Math.min(20,p.hp+fx.n)-p.hp;
    p.hp+=healed;
    floaterAtEl($(heroBarId(side)),"+"+healed,"#7fe06d");
  }
  else if(fx.k==="aoe"){
    const foe=otherSide(side);
    for(let lane=0;lane<5;lane++){
      if(S.lanes[lane][foe]) damageMinion(lane,foe,fx.n,{});
    }
  }
  else if(fx.k==="buff"){
    const m=S.lanes[target.lane][target.side];
    if(m){ m.a+=fx.a; m.hp+=fx.h; m.maxHp+=fx.h; floaterAtCell(target.lane,target.side,"+"+fx.a+"/+"+fx.h,"#7fe06d"); }
  }
  else if(fx.k==="dmg"){
    if(target.hero) heroDamage(target.hero,fx.n);
    else damageMinion(target.lane,target.side,fx.n,{});
  }
  else if(fx.k==="destroy"){
    const m=S.lanes[target.lane][target.side];
    if(m){ addLog(`${m.e}${m.n} destroyed!`); floaterAtCell(target.lane,target.side,"💥","#ff6b6b"); S.lanes[target.lane][target.side]=null; }
  }
  else if(fx.k==="scry"){ startScry(side, fx.n); return; } // scry renders its own overlay; skip the trailing render() below
  else if(fx.k==="buffHand"){
    // target is a reference to the actual hand-card object (captured before this trick
    // was spliced out), NOT an index — splicing the trick out shifts later indices, but
    // object identity in the array survives that untouched
    const t=P(side).hand.find(c=>c===target.handCardRef);
    if(t){
      if(fx.stat==="a") t.a=(t.a||0)+fx.n;
      else t.h=(t.h||0)+fx.n;
      addLog(`${card.e}${card.n} gives ${t.e}${t.n} in hand +${fx.n} ${fx.stat==="a"?"Attack":"HP"}`);
    }
  }
  else if(fx.k==="transfigure"){
    // same object-identity trick as buffHand (see note above) — find the targeted card,
    // then swap it in place for a fresh random pick from the caster's own faction pool
    // (any card type: minion, trick, or environment), excluding itself so it always changes
    const t=P(side).hand.find(c=>c===target.handCardRef);
    if(t){
      const pool=side==="plant"?PLANT_POOL:ZOMBIE_POOL;
      const candidates=pool.filter(c=>c.n!==t.n);
      const pick=candidates[Math.floor(Math.random()*candidates.length)];
      if(pick){
        const idx=P(side).hand.indexOf(t);
        const newCard={...pick};
        if(idx>-1) P(side).hand[idx]=newCard;
        addLog(`${card.e}${card.n} turns ${t.e}${t.n} into ${newCard.e}${newCard.n}!`);
        floaterAtEl($(heroBarId(side)),"🔄","#c9a2ff");
      }
    }
  }
  render();
}

/* ============ SCRY: reveal N, keep 1, shuffle rest back — hard-blocking modal, no cancel ============ */
function startScry(side,n){
  const p=P(side);
  const revealed=[];
  for(let i=0;i<n && p.deck.length>0;i++) revealed.push(p.deck.shift());
  if(revealed.length===0){ addLog(sideName(side)+" deck empty — nothing to scry"); render(); return; }
  if(revealed.length===1){
    // only one card exists to look at — nothing to actually choose between
    if(p.hand.length>=10){ addLog(sideName(side)+" hand full — "+revealed[0].n+" burned"); }
    else p.hand.push(revealed[0]);
    addLog(`${sideName(side)} scried, kept ${revealed[0].e}${revealed[0].n}`);
    render();
    return;
  }
  // the AI resolves its own scries silently — no modal, just a quick heuristic pick
  if(isAiGame() && side===S.aiSide){
    let best=0;
    for(let i=1;i<revealed.length;i++) if(aiScryValue(revealed[i])>aiScryValue(revealed[best])) best=i;
    const chosen=revealed[best], rest=revealed.filter((_,i)=>i!==best);
    if(p.hand.length>=10){ addLog(sideName(side)+" hand full — "+chosen.n+" burned"); }
    else p.hand.push(chosen);
    p.deck.push(...rest); shuffle(p.deck);
    addLog(`${sideName(side)} scried, kept ${chosen.e}${chosen.n}`);
    render();
    return;
  }
  uiLock=true; render();
  showScryPicker(side,revealed);
}
/* prefer cards the AI can realistically cast soon, weighted by raw size */
function aiScryValue(card){
  const res=P(S.aiSide).res;
  let v=card.c + (card.t==="m" ? (card.a+card.h)*0.3 : 1);
  if(card.c<=res) v+=2;             // castable this very turn
  else if(card.c<=Math.min(S.turn+1,10)) v+=1; // castable next turn
  return v;
}
function showScryPicker(side,revealed){
  const oc=$("overlayCard");
  oc.style.maxWidth="440px"; // wider than the default 340px so revealed cards fit in a row
  oc.innerHTML =
    `<h2>🔮 Scry ${revealed.length}</h2><p class="scryHint">Pick one to keep — the rest shuffle back into the deck.</p>`+
    `<div class="scryRow">${revealed.map((c,i)=>`<div class="card scryCard${rarityClass(c)}" data-i="${i}">${cardFaceMarkup(c)}</div>`).join("")}</div>`;
  oc.querySelectorAll(".scryCard").forEach(el=>{
    el.onclick=()=>resolveScry(side,revealed,+el.dataset.i);
  });
  $("overlay").classList.remove("hidden");
}
function resolveScry(side,revealed,chosenIdx){
  const p=P(side), chosen=revealed[chosenIdx];
  const rest=revealed.filter((_,i)=>i!==chosenIdx);
  if(p.hand.length>=10){ addLog(sideName(side)+" hand full — "+chosen.n+" burned"); }
  else p.hand.push(chosen);
  p.deck.push(...rest);
  shuffle(p.deck);
  addLog(`${sideName(side)} scried, kept ${chosen.e}${chosen.n}`);
  $("overlayCard").style.maxWidth=""; // restore default width for other overlay uses
  $("overlay").classList.add("hidden");
  uiLock=false;
  render();
}

/* ============ AI OPPONENT ============ */
/* One brain for either faction. It reuses the human code paths (playMinion / castTrick /
   startScry), so every rule, animation and log line behaves identically — it just picks
   the moves itself, with short pauses so the player can watch what it does.
   Deliberately basic heuristics for now; tune freely later. */
async function aiPhase(){
  uiLock=true; render();
  await sleep(700);
  aiMaybeMulligan();
  if(S.phase==="z1") await aiPlayMinions();
  else if(S.phase==="z2") await aiPlayTricks();
  else if(S.phase==="p"){ await aiPlayMinions(); await aiPlayTricks(); }
  uiLock=false;
  if(S.over){ render(); return; }
  await sleep(450);
  endPhase();
}
/* turn-1 redraw if the hand is clunky: wants 2+ cheap cards and at least one early minion */
function aiMaybeMulligan(){
  if(!canMulligan()) return;
  const hand=P(S.aiSide).hand;
  const cheap=hand.filter(c=>c.c<=2).length;
  const earlyMinions=hand.filter(c=>c.t==="m"&&c.c<=3).length;
  if(cheap>=2 && earlyMinions>=1) return;
  const p=P(S.aiSide), n=p.hand.length;
  p.deck.push(...p.hand.splice(0));
  shuffle(p.deck);
  draw(S.aiSide,n);
  S.mull[S.aiSide]=false;
  addLog(`${sideName(S.aiSide)} mulligans (${n} cards)`);
  render();
}
/* attack math incl. armor + deadly — used to judge trades before making them */
function aiTradeMath(atk,def){
  let out=atk.a;
  if(def.kw.includes("armored")) out=Math.max(0,out-1);
  const kills = out>0 && (out>=def.hp || atk.kw.includes("deadly"));
  return {out,kills};
}
function scoreMinionPlacement(card,lane){
  const foeSide=otherSide(S.aiSide);
  const foe=S.lanes[lane][foeSide];
  let score=card.a + card.h*0.5;                       // base body value
  if(card.op&&card.op.k==="draw") score+=1;
  if(card.op&&card.op.k==="scry") score+=0.5;
  if(foe){
    let foeHp=foe.hp;
    if(card.op&&card.op.k==="dmgLane"){                // on-play ping softens the defender first
      foeHp=Math.max(0,foeHp-card.op.n);
      if(foeHp===0) score+=foe.a+2;                    // ping alone kills it
    }
    const give=aiTradeMath({a:card.a,kw:card.kw},{a:foe.a,kw:foe.kw,hp:foeHp});
    const take=aiTradeMath(foe,{kw:card.kw,hp:card.h});
    score += foe.a;                                    // blocking incoming face damage
    if(foeHp>0){
      if(give.kills) score += foe.a + foeHp*0.4 + 2;
      if(take.kills) score -= card.a + card.h*0.4 + 1;
      if(give.kills && !take.kills) score += 2;        // clean win
      if(!give.kills && take.kills) score -= 3;        // pure chump
    }
  } else {
    score += Math.min(card.a,4)*0.4;                   // open lane = face pressure
    if(card.kw.includes("strike")) score += 0.5;
    if(card.op&&card.op.k==="dmgLane") score -= 1;     // wasted on-play ping
  }
  return score;
}
async function aiPlayMinions(){
  for(let guard=0; guard<10 && !S.over; guard++){
    const p=P(S.aiSide);
    let best=null;
    p.hand.forEach((card,i)=>{
      if(card.t!=="m"||card.c>p.res) return;
      for(let lane=0;lane<5;lane++){
        if(S.lanes[lane][S.aiSide]) continue;
        const sc=scoreMinionPlacement(card,lane)+card.c*0.15; // slight bias toward bigger plays
        if(!best||sc>best.sc) best={i,lane,sc};
      }
    });
    if(!best) return;
    playMinion(best.i,best.lane);
    await sleep(650);
  }
}
/* pick the single best trick play right now, or null. Score >= 1 to bother. */
function aiChooseTrick(){
  const me=S.aiSide, foeSide=otherSide(me), p=P(me), foeP=P(foeSide);
  let best=null;
  const consider=(i,target,sc)=>{ if(sc>=1 && (!best||sc>best.sc)) best={i,target,sc}; };
  p.hand.forEach((card,i)=>{
    if(card.t!=="t"||card.c>p.res) return;
    const fx=card.fx;
    if(fx.k==="dmg"){
      if(foeP.hp<=fx.n){ consider(i,{hero:foeSide},1000); return; }  // lethal — nothing else matters
      let bk=null;
      for(let l=0;l<5;l++){
        const m=S.lanes[l][foeSide];
        if(m&&m.hp<=fx.n){ const v=m.a+m.hp*0.4+2; if(!bk||v>bk.v) bk={l,v}; }
      }
      if(bk) consider(i,{lane:bk.l,side:foeSide},bk.v);              // best clean kill
      else if(foeP.hp<=8) consider(i,{hero:foeSide},1.5);            // keep a low hero honest
    }
    else if(fx.k==="destroy"){
      let bt=null;
      for(let l=0;l<5;l++){
        const m=S.lanes[l][foeSide];
        if(m){ const v=m.a+m.hp; if(!bt||v>bt.v) bt={l,v}; }
      }
      if(bt && bt.v>=7) consider(i,{lane:bt.l,side:foeSide},bt.v-3); // only worth it on real threats
    }
    else if(fx.k==="buff"){
      let bb=null;
      for(let l=0;l<5;l++){
        const m=S.lanes[l][me]; if(!m) continue;
        const foe=S.lanes[l][foeSide];
        let v=0.5;
        if(foe){
          const before=aiTradeMath({a:m.a,kw:m.kw},foe);
          const after=aiTradeMath({a:m.a+fx.a,kw:m.kw},foe);
          const diesBefore=aiTradeMath(foe,{kw:m.kw,hp:m.hp}).kills;
          const diesAfter=aiTradeMath(foe,{kw:m.kw,hp:m.hp+fx.h}).kills;
          if(after.kills&&!before.kills) v+=foe.a+2;                 // buff flips the trade
          if(diesBefore&&!diesAfter) v+=m.a+1;                       // buff saves it
          v+=1;
        } else v += fx.a*0.5;                                        // open lane: more face damage
        if(!bb||v>bb.v) bb={l,v};
      }
      if(bb) consider(i,{lane:bb.l,side:me},bb.v);
    }
    else if(fx.k==="aoe"){
      let kills=0,hits=0;
      for(let l=0;l<5;l++){ const m=S.lanes[l][foeSide]; if(m){ hits++; if(m.hp<=fx.n) kills++; } }
      consider(i,null,kills*3+hits*0.5);
    }
    else if(fx.k==="heal"){
      if(p.hp<20) consider(i,null, p.hp<=10?4 : p.hp<=14?2 : 0.5);
    }
    else if(fx.k==="draw"){
      if(p.hand.length<=6) consider(i,null,1.2);
    }
    else if(fx.k==="scry"){
      if(p.hand.length<=7) consider(i,null,1.1);
    }
  });
  return best;
}
async function aiPlayTricks(){
  for(let guard=0; guard<12 && !S.over; guard++){
    const act=aiChooseTrick();
    if(!act) return;
    castTrick(act.i,act.target);
    await sleep(750);
  }
}

/* ============ DAMAGE ============ */
function damageMinion(lane,side,amt,opts){
  const m=S.lanes[lane][side];
  if(!m) return false;
  let dmg=amt;
  if(opts.attack && m.kw.includes("armored")) dmg=Math.max(0,dmg-1);
  m.hp-=dmg;
  floaterAtCell(lane,side,"-"+dmg,"#ff6b6b");
  if(dmg>0 && opts.attacker && opts.attacker.kw.includes("deadly") && m.hp>0){
    m.hp=0; addLog("☠️ Deadly!");
  }
  if(m.hp<=0){
    S.lanes[lane][side]=null;
    addLog(`${m.e}${m.n} destroyed`);
    render(); return true;
  }
  render(); return false;
}
function heroDamage(side,amt){
  P(side).hp-=amt;
  const bar=$(side==="plant"?"plantBar":"zombieBar");
  floaterAtEl(bar,"-"+amt,"#ff6b6b");
  render();
  if(P(side).hp<=0) gameOver(otherSide(side));
}

/* ============ COMBAT ============ */
async function combat(){
  S.phase="combat"; S.sel=null; uiLock=true; render();
  addLog("⚔️ Combat begins!");
  await sleep(500);
  for(let lane=0; lane<5 && !S.over; lane++){
    await resolveLane(lane);
  }
  uiLock=false;
  if(!S.over){ await sleep(400); nextTurn(); }
}
/* ============ ENVIRONMENTS ============ */
/* Fires once per lane, right before that lane's combat trade, against whatever
   minions currently occupy it. envAllHp/envAllAtk hit both sides; envEnemyAtk/
   envEnemyHp hit only the minion belonging to whichever side did NOT play the
   environment. A -1 HP hazard can outright kill a minion before the fight even
   starts — treated as a permanent stat change (like the Blessing/Manifesto buff
   tricks), not combat damage, so it doesn't interact with armor/deadly. */
async function triggerEnvironment(lane,env){
  const applyTo=(side,stat,amt)=>{
    const m=S.lanes[lane][side];
    if(!m) return;
    if(stat==="atk"){
      m.a=Math.max(0,m.a+amt);
      floaterAtCell(lane,side,(amt>0?"+":"")+amt+"⚔",amt>0?"#ffb95e":"#ff8c42");
    } else {
      m.hp+=amt; m.maxHp=Math.max(1,(m.maxHp||m.hp)+amt);
      floaterAtCell(lane,side,(amt>0?"+":"")+amt+"❤",amt>0?"#7fe06d":"#ff6b6b");
      if(m.hp<=0){
        addLog(`${m.e}${m.n} withers away in ${env.e}${env.n}`);
        S.lanes[lane][side]=null;
      }
    }
  };
  let touched=false;
  const k=env.fx.k, n=env.fx.n;
  if(k==="envAllHp"||k==="envAllAtk"){
    ["plant","zombie"].forEach(s=>{ if(S.lanes[lane][s]){ touched=true; applyTo(s,k==="envAllHp"?"hp":"atk",n); } });
  } else if(k==="envEnemyAtk"||k==="envEnemyHp"){
    const foe=otherSide(env.side);
    if(S.lanes[lane][foe]){ touched=true; applyTo(foe,k==="envEnemyAtk"?"atk":"hp",n); }
  }
  if(touched){
    addLog(`${env.e}${env.n} triggers in lane ${lane+1}`);
    render();
    await sleep(400);
  }
}
/* Both minions in a lane swing at the same time, off the same stat snapshot —
   a trade isn't decided by who goes first. Open lanes still hit the hero directly. */
async function resolveLane(lane){
  const env=S.lanes[lane].env;
  if(env && !S.over) await triggerEnvironment(lane,env);
  // re-read AFTER the environment trigger — it can kill a minion outright (a lingering
  // -1 HP hazard on something already at 1 HP), so these must reflect that
  const p=S.lanes[lane].plant, z=S.lanes[lane].zombie;
  if(!p && !z) return;
  const pCell=$(`cell-plant-${lane}`), zCell=$(`cell-zombie-${lane}`);
  if(pCell) pCell.classList.add("attacking");
  if(zCell) zCell.classList.add("attacking");
  await sleep(420);

  if(p && z){
    addLog(`${p.e}${p.n} clashes with ${z.e}${z.n}`);
    const zArmored=z.kw.includes("armored"), pArmored=p.kw.includes("armored");
    let dmgToZ=p.a; if(zArmored) dmgToZ=Math.max(0,dmgToZ-1);
    let dmgToP=z.a; if(pArmored) dmgToP=Math.max(0,dmgToP-1);
    const zDeadlyKill = dmgToZ>0 && p.kw.includes("deadly");
    const pDeadlyKill = dmgToP>0 && z.kw.includes("deadly");
    z.hp-=dmgToZ; p.hp-=dmgToP;
    if(zDeadlyKill) z.hp=Math.min(z.hp,0);
    if(pDeadlyKill) p.hp=Math.min(p.hp,0);

    const zVariant = zDeadlyKill ? "deadly" : (zArmored ? "armored" : "normal");
    const pVariant = pDeadlyKill ? "deadly" : (pArmored ? "armored" : "normal");
    spawnImpactFx(zCell,zVariant); spawnImpactFx(pCell,pVariant);
    if(zDeadlyKill) spawnFxTag(zCell.getBoundingClientRect(),"Deadly kill","deadly");
    if(pDeadlyKill) spawnFxTag(pCell.getBoundingClientRect(),"Deadly kill","deadly");
    floaterAtCell(lane,"zombie",(zDeadlyKill?"☠":zArmored?"🛡":"")+"-"+dmgToZ, zDeadlyKill?"#c9a2ff":zArmored?"#8fd0ff":"#ff6b6b");
    floaterAtCell(lane,"plant",(pDeadlyKill?"☠":pArmored?"🛡":"")+"-"+dmgToP, pDeadlyKill?"#c9a2ff":pArmored?"#8fd0ff":"#ff6b6b");
    render();
    await sleep(300);

    // grab the freshly re-rendered cells (render() above replaced the DOM nodes) and lock in
    // their positions now, before either one fades out, so beams/arcs can still target them.
    const zCellNow=$(`cell-zombie-${lane}`), pCellNow=$(`cell-plant-${lane}`);
    const zRect = zCellNow ? zCellNow.getBoundingClientRect() : null;
    const pRect = pCellNow ? pCellNow.getBoundingClientRect() : null;

    const zDied=z.hp<=0, pDied=p.hp<=0;
    const deaths=[];
    if(zDied){ addLog(`${z.e}${z.n} destroyed`); deaths.push(playDeath(zCellNow,zVariant)); }
    if(pDied){ addLog(`${p.e}${p.n} destroyed`); deaths.push(playDeath(pCellNow,pVariant)); }
    if(deaths.length) await Promise.all(deaths);
    if(zDied) S.lanes[lane].zombie=null;
    if(pDied) S.lanes[lane].plant=null;
    render();

    // corpse rule: a minion that died in the trade gets no Strikethrough or Frenzy follow-up —
    // the bonus hits belong to survivors only
    if(!pDied && p.kw.includes("strike") && !S.over){
      const heroRect=$(heroBarId("zombie")).getBoundingClientRect();
      spawnPierceBeam(pRect,heroRect); spawnFxTag(heroRect,"Strikethrough","strike");
      heroDamage("zombie",p.a); addLog("⤳ Strikethrough hits hero!");
    }
    if(!zDied && z.kw.includes("strike") && !S.over){
      const heroRect=$(heroBarId("plant")).getBoundingClientRect();
      spawnPierceBeam(zRect,heroRect); spawnFxTag(heroRect,"Strikethrough","strike");
      heroDamage("plant",z.a); addLog("⤳ Strikethrough hits hero!");
    }
    if(zDied && !pDied && p.kw.includes("frenzy") && !S.over){
      await sleep(300); addLog("🔥 Frenzy! Bonus hit on hero");
      const heroRect=$(heroBarId("zombie")).getBoundingClientRect();
      spawnFrenzyArc(zRect,heroRect); spawnFxTag(heroRect,"Frenzy bonus hit","frenzy");
      heroDamage("zombie",p.a);
    }
    if(pDied && !zDied && z.kw.includes("frenzy") && !S.over){
      await sleep(300); addLog("🔥 Frenzy! Bonus hit on hero");
      const heroRect=$(heroBarId("plant")).getBoundingClientRect();
      spawnFrenzyArc(pRect,heroRect); spawnFxTag(heroRect,"Frenzy bonus hit","frenzy");
      heroDamage("plant",z.a);
    }
  } else if(p){
    spawnImpactFx($(heroBarId("zombie")),"normal");
    heroDamage("zombie",p.a);
    if(!S.over) addLog(`${p.e}${p.n} hits hero for ${p.a}`);
  } else if(z){
    spawnImpactFx($(heroBarId("plant")),"normal");
    heroDamage("plant",z.a);
    if(!S.over) addLog(`${z.e}${z.n} hits hero for ${z.a}`);
  }
  await sleep(280);
}

/* ============ FLOATERS ============ */
function floaterAtEl(el,text,color){
  if(!el) return;
  const r=el.getBoundingClientRect();
  const f=document.createElement("div");
  f.className="floater"; f.textContent=text; f.style.color=color||"#fff";
  f.style.left=(r.left+r.width/2-12)+"px"; f.style.top=(r.top+r.height/2-14)+"px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),950);
}
function floaterAtCell(lane,side,text,color){ floaterAtEl($(`cell-${side}-${lane}`),text,color); }
function heroBarId(side){ return side==="plant" ? "plantBar" : "zombieBar"; }

const HERO_MAX_HP=20;
/* hero stat bar: hp fill + name/hp text + hand/deck counts + energy pips (filled = spendable now, out of this turn's max) */
function renderHeroStats(side){
  const pfx=side==="plant"?"p":"z", p=P(side);
  $(pfx+"Hp").textContent=Math.max(0,p.hp);
  $(pfx+"Res").textContent=Math.max(0,p.res);
  $(pfx+"Hand").textContent=p.hand.length;
  $(pfx+"Deck").textContent=p.deck.length;
  const fill=$(pfx+"HpFill");
  if(fill) fill.style.transform=`scaleX(${Math.max(0,Math.min(1,p.hp/HERO_MAX_HP))})`;
}

/* ============ COMBAT FX ============ */
/* readable call-out riding above a deadly kill / strikethrough / frenzy moment — a11y note:
   this is a supplementary visual, the addLog() line next to each call site carries the
   same information for anyone relying on the log instead of the animation */
function spawnFxTag(rect,text,variant){
  if(!rect) return;
  const el=document.createElement("div");
  el.className="fxTag fxTag--"+variant;
  el.textContent=text;
  el.style.left=(rect.left+rect.width/2)+"px";
  el.style.top=rect.top+"px";
  document.body.appendChild(el);
  // the rise animation travels ~1.3x the tag's own height above its anchor point — when the
  // anchor sits near the very top of the screen (e.g. the opponent's hero bar), that would
  // carry it off-screen, so floor the anchor far enough down to keep it fully visible
  const minTop=el.offsetHeight*1.3+8;
  if(rect.top<minTop) el.style.top=minTop+"px";
  setTimeout(()=>el.remove(),900);
}
function spawnImpactFx(el,variant){
  if(!el) return;
  const r=el.getBoundingClientRect();
  const fx=document.createElement("div");
  fx.className="impactFx impactFx--"+variant;
  fx.style.left=(r.left+r.width/2)+"px";
  fx.style.top=(r.top+r.height/2)+"px";
  document.body.appendChild(fx);
  setTimeout(()=>fx.remove(),620);
}
/* strikethrough: the beam originates at the attacker's own cell and lands on the enemy hero bar */
function spawnPierceBeam(fromRect,toRect){
  if(!fromRect||!toRect) return;
  const x1=fromRect.left+fromRect.width/2, y1=fromRect.top+fromRect.height/2;
  const x2=toRect.left+toRect.width/2, y2=toRect.top+toRect.height/2;
  const dist=Math.hypot(x2-x1,y2-y1);
  const angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  const wrap=document.createElement("div");
  wrap.className="pierceBeamWrap";
  wrap.style.left=x1+"px"; wrap.style.top=y1+"px"; wrap.style.width=dist+"px";
  wrap.style.transform=`rotate(${angle}deg)`;
  const beam=document.createElement("div");
  beam.className="pierceBeam";
  wrap.appendChild(beam);
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),420);
}
/* frenzy: a lobbed follow-up hit — thrown from where the kill happened, not a straight pass-through */
function spawnFrenzyArc(fromRect,toRect){
  if(!fromRect||!toRect) return;
  const x1=fromRect.left+fromRect.width/2-13, y1=fromRect.top+fromRect.height/2-13;
  const x2=toRect.left+toRect.width/2-13, y2=toRect.top+toRect.height/2-13;
  const dx=x2-x1, dy=y2-y1;
  const el=document.createElement("div");
  el.className="frenzyArc"; el.textContent="🔥";
  el.style.left=x1+"px"; el.style.top=y1+"px";
  el.style.setProperty("--dx",dx+"px"); el.style.setProperty("--dy",dy+"px");
  el.style.setProperty("--dxh",(dx/2)+"px"); el.style.setProperty("--dyh",(dy/2)+"px");
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),640);
}
/* trick cast preview: a brief floating card (art + name) over wherever the trick landed,
   so it's clear what was just played and what it looked like — purely cosmetic, never awaited */
function spawnTrickPreview(card,x,y){
  const art=artFor(card.n);
  const artHtml = art ? `<img src="${art}" alt="${card.n}">` : `<span class="tpEmoji">${card.e}</span>`;
  const descHtml = card.d ? `<div class="tpDesc">${card.d}</div>` : "";
  const el=document.createElement("div");
  el.className="trickPreview";
  el.innerHTML=`<div class="tpArt">${artHtml}</div><div class="tpName">${card.n}</div>${descHtml}`;
  el.style.left=x+"px"; el.style.top=y+"px";
  document.body.appendChild(el);
  // the description line is wide enough that a lane-1/lane-5 target (near a screen edge)
  // would otherwise clip off-screen — nudge it back on. offsetWidth ignores the entry
  // animation's transform:scale, so it reads the box's true final width even at frame 1.
  const halfW=el.offsetWidth/2, pad=8;
  const clampedX=Math.min(Math.max(x,halfW+pad),window.innerWidth-halfW-pad);
  if(clampedX!==x) el.style.left=clampedX+"px";
  setTimeout(()=>el.remove(),2600); // keep in sync with the .trickPreview animation-duration above
}
/* the losing minion shatters in place; caller awaits before removing it from state so the exit is seen, not skipped */
function playDeath(cellEl,variant){
  return new Promise(resolve=>{
    if(!cellEl){ resolve(); return; }
    cellEl.classList.add("dying");
    if(variant==="deadly") cellEl.classList.add("dyingDeadly");
    setTimeout(resolve, variant==="deadly" ? 370 : 330);
  });
}

/* ============ LOG / HINT ============ */
function addLog(t){ S.log.push(t); $("logBar").textContent=S.log.slice(-2).join("  •  "); }

/* ============ RENDER ============ */
function render(){
  if(!S) return;
  renderHeroStats("zombie"); renderHeroStats("plant");

  const phName={z1:"🎖️ Regime — play minions",p:"⚔️ Otherworld — play cards",z2:"🎖️ Regime — play tricks",combat:"⚔️ Combat!"}[S.phase]||"—";
  const order=["z1","p","z2","combat"], curIdx=order.indexOf(S.phase);
  const stepLabel={z1:"🎖️ Minions",p:"⚔️ Otherworld",z2:"🎖️ Tricks",combat:"⚔️"};
  $("phaseBanner").innerHTML =
    `<div class="turnLabel">Turn ${S.turn} · ${phName}</div>`+
    `<div class="phaseSteps">`+
    order.map((ph,i)=>`<span class="step${i===curIdx?" now":i<curIdx?" done":""}">${stepLabel[ph]}</span>`).join(`<span class="arrow">›</span>`)+
    `</div>`;

  const selCard=(S.sel!==null&&S.phase!=="combat")?P(S.active).hand[S.sel]:null;
  renderRow("zRow","zombie",selCard);
  renderRow("pRow","plant",selCard);
  renderLaneNums();

  const dmgSel=selCard&&selCard.t==="t"&&selCard.fx.k==="dmg";
  $("zombieBar").classList.toggle("targetable",!!(dmgSel&&S.active==="plant"));
  $("plantBar").classList.toggle("targetable",!!(dmgSel&&S.active==="zombie"));

  renderHand(selCard);

  $("mullBtn").classList.toggle("hidden", !canMulligan()||isAiTurn());

  const btn=$("endBtn");
  if(S.phase==="combat"){ btn.textContent="⚔️ Fighting…"; btn.disabled=true; }
  else if(isAiTurn()){ btn.textContent="🤖 Thinking…"; btn.disabled=true; }
  else{
    btn.disabled=false;
    btn.textContent={z1:"Done → Otherworld's turn",p:"Done → Regime tricks",z2:"Start Combat ⚔️"}[S.phase]||"End Phase";
  }

  if(isAiTurn()&&S.phase!=="combat"){ hint(`🤖 ${sideName(S.aiSide)} is thinking…`); saveGame(); return; }
  if(selCard){
    if(selCard.t==="m") hint("Tap a glowing lane to place it · tap elsewhere to cancel");
    else if(selCard.t==="e") hint("Tap any lane to place it — replaces that lane's environment · tap elsewhere to cancel");
    else if(selCard.fx.k==="dmg") hint("Tap an enemy minion or the enemy hero · tap elsewhere to cancel");
    else if(selCard.fx.k==="buff") hint("Tap one of your minions · tap elsewhere to cancel");
    else if(selCard.fx.k==="destroy") hint("Tap an enemy minion · tap elsewhere to cancel");
    else if(selCard.fx.k==="buffHand") hint("Tap a minion in your hand to buff it · tap elsewhere to cancel");
    else if(selCard.fx.k==="transfigure") hint("Tap a card in your hand to transform it · tap elsewhere to cancel");
    else hint("Tap the card again to cast");
  } else if(S.phase==="combat") hint("Lanes fight left to right — minions trade simultaneously");
  else hint("Tap a card to play it, or end the phase");
  saveGame();
}
/* which lane-floor tint class an environment's effect maps to — one per card, since
   right now they're literally just a colored floor (real art comes later) */
function envFloorClass(fx){
  return {envAllHp:"envFloorGrove",envAllAtk:"envFloorScorch",envEnemyAtk:"envFloorMist",envEnemyHp:"envFloorToxic"}[fx.k]||"";
}
function renderRow(elId,side,selCard){
  const row=$(elId); row.innerHTML="";
  for(let lane=0;lane<5;lane++){
    const cell=document.createElement("div");
    cell.className="cell"; cell.id=`cell-${side}-${lane}`;
    const env=S.lanes[lane].env;
    if(env) cell.classList.add(envFloorClass(env.fx));
    cell.onclick=()=>onCellTap(lane,side);
    const m=S.lanes[lane][side];
    if(m){
      cell.classList.add("hasMinion");
      const art=artFor(m.n);
      const face = art ? `<img class="mArt" src="${art}" alt="${m.n}">` : `<div class="mEmoji">${m.e}</div>`;
      cell.innerHTML=`<div class="kwDot">${kwSymbols(m)}</div>${face}<div class="mName">${m.n}</div><div class="mStats"><span class="a">⚔${m.a}</span><span class="h">❤${m.hp}</span></div>`;
      if(selCard&&selCard.t==="t"){
        const fx=selCard.fx;
        if(fx.k==="buff"&&side===S.active) cell.classList.add("validTarget");
        if((fx.k==="dmg"||fx.k==="destroy")&&side===otherSide(S.active)) cell.classList.add("validTarget");
      }
    } else if(selCard&&selCard.t==="m"&&side===S.active){
      cell.classList.add("validSpot");
    }
    // environments target the lane, not a side — every cell in every lane is a valid
    // drop target while one's selected, whether or not a minion (or another env) is there
    if(selCard&&selCard.t==="e") cell.classList.add("validSpot");
    row.appendChild(cell);
  }
}
/* the lane-number strip doubles as the environment indicator — its center position
   between the two rows stays put regardless of who's active, so it reads as
   belonging to the lane itself rather than either side */
function renderLaneNums(){
  const el=$("laneNums"); if(!el) return;
  el.innerHTML = S.lanes.map((l,i)=>{
    const env=l.env;
    const tag = env ? `<span class="laneEnvTag" title="${escapeHtml(env.n)}">${env.e}</span>` : "";
    return `<span>Lane ${i+1}${tag}</span>`;
  }).join("");
}
/* shared by the in-hand card strip and the compendium, so the two never drift apart */
function cardFaceMarkup(card){
  let desc = card.t==="m"
    ? [card.kw.map(k=>KWNAME[k]).join(" "),card.d].filter(Boolean).join(" · ")
    : card.d;
  const art=artFor(card.n);
  const artHtml = art ? `<img src="${art}" alt="${card.n}">` : `<span class="cEmoji">${card.e}</span>`;
  const typeTag = card.t==="m"
    ? `<div class="cStats"><span class="a">⚔${card.a}</span><span class="h">❤${card.h}</span></div>`
    : card.t==="e" ? `<div class="trickTag envTag">🌍 ENVIRONMENT</div>` : `<div class="trickTag">✨ TRICK</div>`;
  return `<div class="cost"><span>${card.c}</span></div><div class="cArt">${artHtml}</div><div class="cName">${card.n}</div><div class="cDesc">${desc||""}</div>${typeTag}`;
}
function renderHand(selCard){
  const handEl=$("hand"); handEl.innerHTML="";
  if(S.phase==="combat"||S.over||S.handoff||isAiTurn()){ updateHandFade(); return; } // AI's hand stays hidden
  const buffHandSel = selCard && selCard.t==="t" && selCard.fx.k==="buffHand";
  const transfigureSel = selCard && selCard.t==="t" && selCard.fx.k==="transfigure";
  P(S.active).hand.forEach((card,i)=>{
    const el=document.createElement("div");
    el.className="card"+rarityClass(card);
    if(!canPlayCard(card)) el.classList.add("unplayable");
    if(S.sel===i) el.classList.add("selected");
    // while a hand-buff trick is selected, spotlight the other minions it can target
    if(buffHandSel && i!==S.sel && card.t==="m") el.classList.add("validHandTarget");
    // Transfigure can target any card type in hand except itself
    if(transfigureSel && i!==S.sel) el.classList.add("validHandTarget");
    el.innerHTML=cardFaceMarkup(card);
    el.onclick=()=>onCardTap(i);
    handEl.appendChild(el);
  });
  updateHandFade();
}
/* compendium: every unique card in both pools, browsable outside of a match.
   Cards are tappable — data-name looks them up in ALL_CARDS for the zoomed-in view. */
let compendiumBuilt=false;
function renderCompendium(){
  if(compendiumBuilt) return;
  $("compPlantGrid").innerHTML = PLANT_POOL.map(c=>`<div class="card${rarityClass(c)}${isCoreCard(c.n)?' coreCard':''}" data-name="${c.n}" title="${isCoreCard(c.n)?'Core Set — you own 4 copies':''}">${cardFaceMarkup(c)}${coreBadgeHtml(c.n)}</div>`).join("");
  $("compZombieGrid").innerHTML = ZOMBIE_POOL.map(c=>`<div class="card zSide${rarityClass(c)}${isCoreCard(c.n)?' coreCard':''}" data-name="${c.n}" title="${isCoreCard(c.n)?'Core Set — you own 4 copies':''}">${cardFaceMarkup(c)}${coreBadgeHtml(c.n)}</div>`).join("");
  compendiumBuilt=true;
}
/* zoomed-in card view: bigger art, full stats, and a flavor quote if one exists */
function zoomCard(card){
  const art=artFor(card.n);
  const artHtml = art
    ? `<img src="${art}" alt="${card.n}">`
    : `<span class="zEmoji">${card.e}</span>`;
  const isMinion = card.t==="m";
  const costBadge = `<span class="zCostWrap"><span class="zCostBadge"><span>${card.c}</span></span></span>`;
  const statsHtml = isMinion
    ? `${costBadge}<span class="zStat zAtk">⚔ ${card.a}</span><span class="zStat zHp">❤ ${card.h}</span>`
    : card.t==="e" ? `${costBadge}<span class="zStat zEnv">🌍 Environment</span>` : `${costBadge}<span class="zStat zTrick">✨ Trick</span>`;
  const kwHtml = isMinion && card.kw.length
    ? `<p class="zKw">${card.kw.map(k=>KWDESC[k]).join("<br>")}</p>` : "";
  const descHtml = card.d ? `<p>${card.d}</p>` : "";
  const flavor = flavorFor(card);
  const flavorHtml = flavor ? `<p class="zFlavor">${flavor}</p>` : "";
  // recolor the modal purple for a Regime card instead of always defaulting to
  // the Otherworld's green — same lookup used to tint compendium/deckbuilder cards
  const zombieCard = ZOMBIE_POOL.some(c=>c.n===card.n);
  $("overlayCard").classList.toggle("zSide", zombieCard);
  // carry the card's rarity border into the zoomed view too — clear any rarity class
  // left over from a previous zoom before applying this card's own (if it has one)
  $("overlayCard").classList.remove("rarity-rare","rarity-epic","rarity-legendary");
  const rc=rarityClass(card).trim();
  if(rc) $("overlayCard").classList.add(rc);
  $("overlayCard").innerHTML = `
    <div class="zArt">${artHtml}</div>
    <h2>${card.n}</h2>
    <div class="zStats">${statsHtml}</div>
    ${kwHtml}${descHtml}${flavorHtml}
    <button id="closeZoom">Close</button>`;
  $("overlay").classList.remove("hidden");
  $("closeZoom").onclick=()=>{
    $("overlay").classList.add("hidden");
    $("overlayCard").classList.remove("zSide","rarity-rare","rarity-epic","rarity-legendary");
    if(S) render();
  };
}
/* tapping a minion already on the board (no card selected) opens the same zoomed
   view as the compendium — base card info (cost/keyword text/flavor) merged with
   this minion's current battlefield atk/hp, which may differ from base if buffed/hurt */
function zoomPlacedMinion(m){
  const base=ALL_CARDS[m.n];
  if(!base) return;
  zoomCard({...base, a:m.a, h:m.hp});
}
/* edge-fade cue: tells the player there are more cards off-screen to scroll to */
function updateHandFade(){
  const hand=$("hand");
  if(!hand) return;
  const overflowing = hand.scrollWidth > hand.clientWidth + 2;
  if(!overflowing){ hand.style.maskImage=""; hand.style.webkitMaskImage=""; return; }
  const atStart = hand.scrollLeft <= 4;
  const atEnd = hand.scrollLeft + hand.clientWidth >= hand.scrollWidth - 4;
  const left = atStart ? "black 0" : "transparent 0, black 20px";
  const right = atEnd ? "black 100%" : "black calc(100% - 20px), transparent 100%";
  const grad = `linear-gradient(to right, ${left}, ${right})`;
  hand.style.maskImage = grad;
  hand.style.webkitMaskImage = grad;
}
